<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Cache Monitor</title>
    <style>
        body { margin: 0; padding: 24px; font-family: Arial, sans-serif; background: #f5f6f8; color: #222; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { margin-bottom: 8px; }
        .sub { color: #666; margin-bottom: 20px; }
        .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
        button { padding: 8px 14px; border: 0; border-radius: 6px; cursor: pointer; background: #222; color: #fff; }
        .time { color: #666; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 14px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #fafafa; }
        .ok { color: #16803c; font-weight: bold; }
        .empty { color: #c62828; font-weight: bold; }
        pre { background: #111; color: #eee; padding: 16px; border-radius: 8px; overflow: auto; max-height: 500px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Binance Cache Monitor</h1>
    <div class="sub">开发环境专用 · Caffeine KlineCache</div>
    <div class="toolbar">
        <button onclick="loadCache()">刷新</button>
        <span class="time" id="time">--</span>
    </div>
    <table>
        <thead>
        <tr>
            <th>Symbol</th>
            <th>周期</th>
            <th>缓存数量</th>
            <th>最新开盘时间</th>
            <th>最新收盘价</th>
            <th>状态</th>
        </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>
    <h3>缓存详情</h3>
    <pre id="detail">点击刷新查看</pre>
</div>
<script>
    async function loadCache() {
        const response = await fetch('/api/cache/kline');
        const data = await response.json();
        const rows = document.getElementById('rows');
        rows.innerHTML = '';
        Object.entries(data.symbols).forEach(([symbol, value]) => {
            const latest = value.latest;
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${symbol}</td>
                <td>${value.interval}</td>
                <td>${value.size}</td>
                <td>${latest ? latest.openTime : '-'}</td>
                <td>${latest ? latest.closePrice : '-'}</td>
                <td class="${value.size > 0 ? 'ok' : 'empty'}">${value.size > 0 ? '正常' : '无数据'}</td>
            `;
            rows.appendChild(row);
        });
        document.getElementById('detail').textContent = JSON.stringify(data, null, 2);
        document.getElementById('time').textContent = '最后刷新：' + new Date().toLocaleString();
    }

    loadCache();
    setInterval(loadCache, 5000);
</script>
</body>
</html>
