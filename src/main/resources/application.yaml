spring:
  profiles:
    active: local
  application:
    name: bian_bot

logging:
  level:
    root: INFO

# ==================== 交易配置 ====================
trading:
  # 是否允许交易信号真正发送订单
  enabled: false
  # 每次开仓使用的 USDT 金额
  usdt-amount: 10
  # 下单模式：
  # LIMIT  = 限价单
  # MARKET = 市价单
  order-type: MARKET
  # 限价单价格来源：
  # LATEST_PRICE = 使用当前最新价格
  limit-price-source: LATEST_PRICE
  # 是否启用止盈止损
  take-profit-stop-loss-enabled: true
  # 止盈金额，单位：USDT
  take-profit-amount: 0.2
  # 止损金额，单位：USDT
  stop-loss-amount: 0.2
  # 保证金模式：
  # ISOLATED = 逐仓
  # CROSSED  = 全仓
  margin-type: CROSSED
  # 是否使用交易对允许的最大杠杆
  # true  = 自动使用该交易对最大杠杆，下面的 leverage 配置失效
  # false = 使用下面 leverage 配置的杠杆
  use-max-leverage: true
  # 目标杠杆
  # 当 use-max-leverage=true 时，此配置不生效
  leverage: 20
  # 下单前是否自动设置杠杆
  auto-set-leverage: true
